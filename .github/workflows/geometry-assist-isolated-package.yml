name: Geometry Assist Isolated Package

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/Geometry_Assist_Proxy_Lab/package/**'
      - 'Experimental/Geometry_Assist_Proxy_Lab/Tests/**'
      - '.github/workflows/geometry-assist-isolated-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static contract
        run: python Experimental/Geometry_Assist_Proxy_Lab/Tests/test_static_contract.py

      - name: Compile workers
        run: python -m compileall -q Experimental/Geometry_Assist_Proxy_Lab/package/Runtime/worker

      - name: Build package
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          src = Path("Experimental/Geometry_Assist_Proxy_Lab/package")
          for cache in src.rglob("__pycache__"):
              shutil.rmtree(cache)
          for pyc in src.rglob("*.pyc"):
              pyc.unlink()
          out = Path("dist")
          out.mkdir(exist_ok=True)
          base = out / "ConceptGhost_Geometry_Assist_Diagnostic_Isolated_r2"
          zip_path = Path(shutil.make_archive(str(base), "zip", root_dir=src))
          h = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (out / "SHA256.txt").write_text(f"{h}  {zip_path.name}\n", encoding="utf-8")
          print(zip_path)
          print(h)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_Geometry_Assist_Diagnostic_Isolated_r2
          path: |
            dist/ConceptGhost_Geometry_Assist_Diagnostic_Isolated_r2.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

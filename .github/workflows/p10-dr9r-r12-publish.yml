name: Publish DR9R r12 Bundle

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - '.github/workflows/p10-dr9r-r12-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-r12:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen r11 base release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r12-build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          gh release download p10-dr9r-r11 --repo ${{ github.repository }} --pattern 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r11.zip' --dir $build
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r11.zip'
          if (-not (Test-Path $source)) { throw 'Frozen r11 release asset was not downloaded.' }
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '5edaaaad1ca7c2a054bd019d48cc359a52146b6d10cb56e01cecea5880ce7e1c') {
            throw "Unexpected r11 base digest: $hash"
          }

      - name: Build deterministic r12 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r12-build'
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r11.zip'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip'
          $extracted = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12'
          python Experimental/P10_Lab/release_hotfixes/r12/build_r12_from_r11.py --source $source --output $zip --hotfix-commit $env:GITHUB_SHA --keep-extracted $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate r12 runtime package contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r12-build'
          $root = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12'

          foreach ($rel in @('Installer/install_dr12.ps1','Installer/verify_dr12.ps1')) {
            if (-not (Test-Path (Join-Path $root $rel) -PathType Leaf)) { throw "Missing r12 entrypoint: $rel" }
          }

          foreach ($ps1 in Get-ChildItem (Join-Path $root 'Installer') -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$($ps1.Name): $($_.Message)" }; throw "PowerShell parse failed: $($ps1.Name)" }
          }

          foreach ($batName in @('03_INSTALL_ALL.bat','04_VERIFY_INSTALL.bat')) {
            $bat = Join-Path $root $batName
            $bytes = [System.IO.File]::ReadAllBytes($bat)
            for ($i=0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) { throw "CRLF validation failed for $batName" }
            }
          }

          python (Join-Path $root 'Installer/test_dr9_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $root 'Installer/test_r12_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write integrity sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip" | Set-Content -Encoding ascii release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12_SHA256.txt
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r12-build'
          Copy-Item (Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12/P10_DR9_VALIDATION.txt') release/P10_DR9R_R12_VALIDATION.txt -Force
          Write-Host "R12 SHA-256: $hash"
          Write-Host "R12 bytes: $((Get-Item $zip).Length)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (gh release view p10-dr9r-r12 --repo ${{ github.repository }} 2>$null) {
            gh release delete p10-dr9r-r12 --repo ${{ github.repository }} --yes --cleanup-tag
          }
          gh release create p10-dr9r-r12 release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12_SHA256.txt release/P10_DR9R_R12_VALIDATION.txt --repo ${{ github.repository }} --target $env:GITHUB_SHA --title 'ConceptGhost P10 DR9R r12 — MoGe Evidence Profile Compatibility' --notes 'r12 supersedes r11 for runtime acceptance. The target run proved MoGe-3 completed successfully; node 1011 then rejected a diagnostic-only profile extension. r12 permits only diagnostic_return_per_step to differ while all geometry-authority fields remain fail-closed. P9/P10 geometry authority is unchanged.'

      - name: Upload r12 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_DR9R_R12_READY
          path: |
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12_SHA256.txt
            release/P10_DR9R_R12_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30

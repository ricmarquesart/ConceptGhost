name: Publish DR9R r13 Bundle

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - '.github/workflows/p10-dr9r-r13-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-r13:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen r12 base release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r13-build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          gh release download p10-dr9r-r12 --repo ${{ github.repository }} --pattern 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip' --dir $build
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip'
          if (-not (Test-Path $source)) { throw 'Frozen r12 release asset was not downloaded.' }
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '334f926dc8ecb86172ed1839201abd1e7d3994d64b5386c72cd2dc215e529bdb') {
            throw "Unexpected r12 base digest: $hash"
          }

      - name: Build deterministic r13 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r13-build'
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r12.zip'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13.zip'
          $extracted = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13'
          python Experimental/P10_Lab/release_hotfixes/r13/build_r13_from_r12.py --source $source --output $zip --route-editor-source Experimental/P10_Lab/p10_lab/web/js/drone_route_editor.js --hotfix-commit $env:GITHUB_SHA --keep-extracted $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate r13 frontend and package contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r13-build'
          $root = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13'

          foreach ($rel in @('Installer/install_dr13.ps1','Installer/verify_dr13.ps1')) {
            if (-not (Test-Path (Join-Path $root $rel) -PathType Leaf)) { throw "Missing r13 entrypoint: $rel" }
          }

          foreach ($ps1 in Get-ChildItem (Join-Path $root 'Installer') -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($ps1.Name): $($_.Message)" }
              throw "PowerShell parse failed: $($ps1.Name)"
            }
          }

          foreach ($batName in @('03_INSTALL_ALL.bat','04_VERIFY_INSTALL.bat')) {
            $bat = Join-Path $root $batName
            $bytes = [System.IO.File]::ReadAllBytes($bat)
            for ($i=0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) {
                throw "CRLF validation failed for $batName"
              }
            }
          }

          python (Join-Path $root 'Installer/test_dr9_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $root 'Installer/test_r13_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $routeJs = Join-Path $root 'Payload/custom_nodes/ConceptGhost_P10_Lab/web/js/drone_route_editor.js'
          node --check $routeJs
          if ($LASTEXITCODE -ne 0) { throw 'drone_route_editor.js failed node --check' }

      - name: Write integrity sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13.zip" | Set-Content -Encoding ascii release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13_SHA256.txt
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r13-build'
          Copy-Item (Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13/P10_DR9_VALIDATION.txt') release/P10_DR9R_R13_VALIDATION.txt -Force
          Write-Host "R13 SHA-256: $hash"
          Write-Host "R13 bytes: $((Get-Item $zip).Length)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (gh release view p10-dr9r-r13 --repo ${{ github.repository }} 2>$null) {
            gh release delete p10-dr9r-r13 --repo ${{ github.repository }} --yes --cleanup-tag
          }
          gh release create p10-dr9r-r13 release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13.zip release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13_SHA256.txt release/P10_DR9R_R13_VALIDATION.txt --repo ${{ github.repository }} --target $env:GITHUB_SHA --title 'ConceptGhost P10 DR9R r13 — Route Editor Frontend Repair' --notes 'r13 supersedes r12 for runtime acceptance. Workflow 01 Run #1 backend completed, but malformed duplicated JavaScript declarations prevented the drone-route DOM editor from mounting. r13 repairs the frontend, adds source/package regression guards and Node.js syntax validation. P9/P10 geometry authority is unchanged.'

      - name: Upload r13 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_DR9R_R13_READY
          path: |
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13.zip
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r13_SHA256.txt
            release/P10_DR9R_R13_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30

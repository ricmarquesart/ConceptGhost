name: Publish DR9R r15 Bundle

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - '.github/workflows/p10-dr9r-r15-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-r15:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen r14 base release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r15-build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          gh release download p10-dr9r-r14 --repo ${{ github.repository }} --pattern 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r14.zip' --dir $build
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r14.zip'
          if (-not (Test-Path $source)) { throw 'Frozen r14 release asset was not downloaded.' }
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '66e2486e501d79ef9cb06c498d42fc96bd982c37abca65fd0a595b344c4f6c85') {
            throw "Unexpected r14 base digest: $hash"
          }

      - name: Build deterministic r15 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r15-build'
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r14.zip'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip'
          $extracted = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15'
          python Experimental/P10_Lab/release_hotfixes/r15/build_r15_from_r14.py --source $source --output $zip --route-editor-source Experimental/P10_Lab/p10_lab/web/js/drone_route_editor.js --hotfix-commit $env:GITHUB_SHA --keep-extracted $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate r15 zoom and package contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r15-build'
          $root = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15'

          foreach ($rel in @('Installer/install_dr15.ps1','Installer/verify_dr15.ps1')) {
            if (-not (Test-Path (Join-Path $root $rel) -PathType Leaf)) { throw "Missing r15 entrypoint: $rel" }
          }

          foreach ($ps1 in Get-ChildItem (Join-Path $root 'Installer') -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($ps1.Name): $($_.Message)" }
              throw "PowerShell parse failed: $($ps1.Name)"
            }
          }

          foreach ($batName in @('03_INSTALL_ALL.bat','04_VERIFY_INSTALL.bat')) {
            $bat = Join-Path $root $batName
            $bytes = [System.IO.File]::ReadAllBytes($bat)
            for ($i=0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) {
                throw "CRLF validation failed for $batName"
              }
            }
          }

          python (Join-Path $root 'Installer/test_dr9_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $root 'Installer/test_r15_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $routeJs = Join-Path $root 'Payload/custom_nodes/ConceptGhost_P10_Lab/web/js/drone_route_editor.js'
          node --check $routeJs
          if ($LASTEXITCODE -ne 0) { throw 'drone_route_editor.js failed node --check' }

      - name: Write integrity sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip" | Set-Content -Encoding ascii release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15_SHA256.txt
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-r15-build'
          Copy-Item (Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15/P10_DR9_VALIDATION.txt') release/P10_DR9R_R15_VALIDATION.txt -Force
          Write-Host "R15 SHA-256: $hash"
          Write-Host "R15 bytes: $((Get-Item $zip).Length)"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (gh release view p10-dr9r-r15 --repo ${{ github.repository }} 2>$null) {
            gh release delete p10-dr9r-r15 --repo ${{ github.repository }} --yes --cleanup-tag
          }
          gh release create p10-dr9r-r15 release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15_SHA256.txt release/P10_DR9R_R15_VALIDATION.txt --repo ${{ github.repository }} --target $env:GITHUB_SHA --title 'ConceptGhost P10 DR9R r15 — Route Editor Local Zoom' --notes 'r15 supersedes r14 for runtime acceptance. Target runtime confirmed the Route Setup editor works, but wheel input over the camera/drone panels still zoomed the outer ComfyUI workspace. r15 captures wheel input inside the editor, stops workspace propagation, applies local cursor-anchored zoom, and adds explicit −/+ controls to every Perspective/TOP/SIDE/FRONT viewport. P9/P10 geometry authority is unchanged.'

      - name: Upload r15 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_DR9R_R15_READY
          path: |
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip
            release/ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15_SHA256.txt
            release/P10_DR9R_R15_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30

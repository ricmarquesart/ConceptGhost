name: Publish DR9R r5 bundle release

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - .github/workflows/p10-dr9r-r5-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: ConceptGhost_v1.54_P10_DR9R_COMPLETE_TWO_STAGE_INSTALLER_r5.zip
      EXPECTED_SHA256: 63ec487e3a73e98018cb72d5d27472ada3e33ccbd450ebf964028e558420be1d
      BUNDLE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-60e0-8230-beea-c4405cc59daa/raw?se=2026-09-23T16%3A06%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=c0038130-4fee-5557-8a89-ae431fabc0c4&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T15%3A00%3A55Z&ske=2026-09-24T15%3A00%3A55Z&sks=b&skv=2026-02-06&sig=3E8F8wt27MrLJM4mWyadyVyTz3NDny1FRD765T1%2BtdE%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Download exact validated bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" --output "$FILE_NAME"
          echo "$EXPECTED_SHA256  $FILE_NAME" | sha256sum --check -

      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create p10-dr9r-r5 "$FILE_NAME#ConceptGhost DR9R r5 complete two-stage installer" \
            --target "$GITHUB_SHA" \
            --title "ConceptGhost v1.54 P10 DR9R r5" \
            --notes "Final DR9R user-test bundle. Two-stage flow: Route Setup -> artist route commit -> P10 Production. SHA-256: $EXPECTED_SHA256"

      - name: Preserve as Actions artifact too
        uses: actions/upload-artifact@v4
        with:
          name: conceptghost-p10-dr9r-r5-bundle
          path: ${{ env.FILE_NAME }}
          if-no-files-found: error
          retention-days: 90

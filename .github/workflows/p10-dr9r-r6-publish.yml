name: Publish DR9R r6 bundle release

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - .github/workflows/p10-dr9r-r6-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: ConceptGhost_v1.54_P10_DR9R_COMPLETE_TWO_STAGE_INSTALLER_r6.zip
      EXPECTED_SHA256: be3e3fc5ef84f404a41cd7177b16a5aa9331ba0420c6013397a4f641413226d5
      BUNDLE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-1bf4-8230-9e36-b5bcfa277829/raw?se=2026-09-23T16%3A14%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=7d526874-1fc6-533d-82f4-a92f642f2d59&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T12%3A05%3A31Z&ske=2026-09-24T12%3A05%3A31Z&sks=b&skv=2026-02-06&sig=06QtTh3Tz7uQw7PCQihawqfRimcgy2yeN0XSsnTds1U%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download exact validated bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" --output "$FILE_NAME"
          echo "$EXPECTED_SHA256  $FILE_NAME" | sha256sum --check -
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create p10-dr9r-r6 "$FILE_NAME#ConceptGhost DR9R r6 complete two-stage installer" \
            --target "$GITHUB_SHA" \
            --title "ConceptGhost v1.54 P10 DR9R r6" \
            --notes "Final DR9R runtime-acceptance bundle. Route Setup -> artist route commit -> P10 Production. Three Queue Prompt clicks for a new scene, one expensive P9 solve, one P10 Production run. SHA-256: $EXPECTED_SHA256"
      - name: Preserve as Actions artifact too
        uses: actions/upload-artifact@v4
        with:
          name: conceptghost-p10-dr9r-r6-bundle
          path: ${{ env.FILE_NAME }}
          if-no-files-found: error
          retention-days: 90

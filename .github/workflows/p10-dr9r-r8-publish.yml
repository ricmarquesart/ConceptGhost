name: Publish DR9R r8 MoGe diagnostics bundle
on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - .github/workflows/p10-dr9r-r8-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r8.zip
      EXPECTED_SHA256: 9774a887e397e18d9dcb76c65dea29ce4496ec95f0fa75570b400238dad0139c
      BUNDLE_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-e244-81f5-a0c8-d9077f8c8254/raw?se=2026-09-23T18%3A24%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=5f39afe9-f455-5203-919f-e7bc551ede24&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A52%3A48Z&ske=2026-09-24T01%3A52%3A48Z&sks=b&skv=2026-02-06&sig=8R%2BoTsRQrw7Rk69o1l0ZGpyTsMtEs/Om7zYd3HR6dc8%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Download exact validated bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" --output "$FILE_NAME"
          echo "$EXPECTED_SHA256  $FILE_NAME" | sha256sum --check -
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create p10-dr9r-r8 "$FILE_NAME#ConceptGhost DR9R r8 optional MoGe diagnostics bundle" \
            --target "$GITHUB_SHA" \
            --title "ConceptGhost P10 DR9R r8 - Optional MoGe Depth Diagnostics" \
            --notes "Two-stage Route Setup + Production. Adds optional P9 MoGe depth diagnostics, OFF by default and diagnostic-only. Stable numbered workflow filenames. SHA-256: $EXPECTED_SHA256"
      - name: Preserve as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: conceptghost-p10-dr9r-r8-bundle
          path: ${{ env.FILE_NAME }}
          if-no-files-found: error
          retention-days: 90

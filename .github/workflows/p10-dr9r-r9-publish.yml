name: Publish DR9R r9 installer hotfix bundle
on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - .github/workflows/p10-dr9r-r9-publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FILE_NAME: ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r9.zip
      EXPECTED_SHA256: 1143e94e0fcbfcf25809efa0a21fae162fa79079c3223b8ea2eec677069609bf
      BUNDLE_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-08a4-81fd-b5d7-7a7783461b12/raw?se=2026-09-23T19%3A08%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=7adc3bcd-ef20-5497-bee7-cb06ab8088f9&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T16%3A26%3A12Z&ske=2026-09-24T16%3A26%3A12Z&sks=b&skv=2026-02-06&sig=AAg21W8vVVwZT3SjlqNQx3zCN2hSw/yjIR6Kw/v5IC8%3D"
      SOURCE_COMMIT: f9ca7c6070a10c9c39a241ef9ebe8c4822988f66
    steps:
      - uses: actions/checkout@v4
      - name: Download exact validated bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" --output "$FILE_NAME"
          echo "$EXPECTED_SHA256  $FILE_NAME" | sha256sum --check -
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create p10-dr9r-r9 "$FILE_NAME#ConceptGhost DR9R r9 installer hotfix bundle" \
            --target "$SOURCE_COMMIT" \
            --title "ConceptGhost P10 DR9R r9 - Installer Hotfix + Requirement Audit" \
            --notes "Corrects protected shared-Python fingerprinting, keeps legacy Master private, preserves numbered two-stage workflows, safe storage cleanup, route-editor callback hotfix, and optional MoGe diagnostics. SHA-256: $EXPECTED_SHA256"
      - name: Preserve as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: conceptghost-p10-dr9r-r9-bundle
          path: ${{ env.FILE_NAME }}
          if-no-files-found: error
          retention-days: 90

name: Gate 7.3 Free-Space Tests

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/p10_lab/colmap_dense_io.py'
      - 'Experimental/P10_Lab/p10_lab/free_space_evidence.py'
      - 'Experimental/P10_Lab/p10_lab/free_space_constraints.py'
      - 'Experimental/P10_Lab/p10_lab/prefusion_mesh.py'
      - 'Experimental/P10_Lab/tests/test_gate7_free_space.py'
      - '.github/workflows/p10-g7-3-free-space.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate7-3:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install focused runtime dependency
        run: python -m pip install numpy

      - name: Compile Gate 7.3 modules
        run: |
          python -m py_compile Experimental/P10_Lab/p10_lab/colmap_dense_io.py
          python -m py_compile Experimental/P10_Lab/p10_lab/free_space_evidence.py
          python -m py_compile Experimental/P10_Lab/p10_lab/free_space_constraints.py
          python -m py_compile Experimental/P10_Lab/p10_lab/prefusion_mesh.py

      - name: Run Gate 7.3 focused tests
        working-directory: Experimental/P10_Lab
        run: python -m unittest -v tests.test_gate7_free_space

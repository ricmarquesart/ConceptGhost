name: Gate 7.4 Protected Fusion Tests

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/p10_lab/protected_fusion.py'
      - 'Experimental/P10_Lab/tests/test_protected_fusion.py'
      - '.github/workflows/p10-g7-4-protected-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate7-4:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install focused runtime dependency
        run: python -m pip install numpy

      - name: Compile Gate 7.4 module
        run: python -m py_compile Experimental/P10_Lab/p10_lab/protected_fusion.py

      - name: Run Gate 7.4 focused tests
        working-directory: Experimental/P10_Lab
        run: python -m unittest -v tests.test_protected_fusion

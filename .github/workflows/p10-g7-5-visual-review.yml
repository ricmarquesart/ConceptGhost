name: Gate 7.5 Visual Review Tests

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/p10_lab/gate7_visual_review.py'
      - 'Experimental/P10_Lab/p10_lab/preview_nodes.py'
      - 'Experimental/P10_Lab/tests/test_gate7_visual_review.py'
      - '.github/workflows/p10-g7-5-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate7-5:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install focused runtime dependencies
        run: python -m pip install numpy pillow

      - name: Compile Gate 7.5 modules
        run: |
          python -m py_compile Experimental/P10_Lab/p10_lab/gate7_visual_review.py
          python -m py_compile Experimental/P10_Lab/p10_lab/preview_nodes.py

      - name: Run Gate 7.5 focused tests
        working-directory: Experimental/P10_Lab
        run: python -m unittest -v tests.test_gate7_visual_review

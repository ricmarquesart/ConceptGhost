name: Build Gate 7 Preview r1 Candidate

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/release_hotfixes/gate7_preview_r1/**'
      - '.github/workflows/p10-gate7-preview-r1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen r15 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-g7-preview-r1'
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          gh release download p10-dr9r-r15 --repo ${{ github.repository }} --pattern 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip' --dir $build
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip'
          if (-not (Test-Path $source)) { throw 'Frozen r15 release asset was not downloaded.' }
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'cab56065d612e7e038bcb526307047d57134262471098e56d0225b74defee3dd') {
            throw "Unexpected r15 base digest: $hash"
          }

      - name: Build Gate 7 Preview r1 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-g7-preview-r1'
          $source = Join-Path $build 'ConceptGhost_v1.54_P10_DR9R_MOGE_DIAGNOSTICS_TWO_STAGE_INSTALLER_r15.zip'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1.zip'
          $extracted = Join-Path $build 'ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1'
          python Experimental/P10_Lab/release_hotfixes/gate7_preview_r1/build_gate7_preview_r1_from_r15.py --source $source --output $zip --p10-source-root Experimental/P10_Lab/p10_lab --hotfix-commit $env:GITHUB_SHA --keep-extracted $extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Gate 7 Preview r1 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-g7-preview-r1'
          $root = Join-Path $build 'ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1'

          foreach ($rel in @('Installer/install_gate7_preview_r1.ps1','Installer/verify_gate7_preview_r1.ps1')) {
            if (-not (Test-Path (Join-Path $root $rel) -PathType Leaf)) { throw "Missing entrypoint: $rel" }
          }

          foreach ($ps1 in Get-ChildItem (Join-Path $root 'Installer') -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($ps1.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($ps1.Name): $($_.Message)" }
              throw "PowerShell parse failed: $($ps1.Name)"
            }
          }

          foreach ($batName in @('03_INSTALL_ALL.bat','04_VERIFY_INSTALL.bat')) {
            $bat = Join-Path $root $batName
            $bytes = [System.IO.File]::ReadAllBytes($bat)
            for ($i=0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) {
                throw "CRLF validation failed for $batName"
              }
            }
          }

          python (Join-Path $root 'Installer/test_dr9_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $root 'Installer/test_gate7_preview_bundle.py') $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $workflow = Get-Content (Join-Path $root 'Payload/workflows/02_ConceptGhost_P10_PRODUCTION.json') -Raw | ConvertFrom-Json
          $types = @($workflow.nodes | ForEach-Object { $_.type })
          foreach ($required in @('ConceptGhostP10Gate7Runtime','ConceptGhostP10Gate7VisualEvidencePack')) {
            if ($types -notcontains $required) { throw "Gate 7 Preview workflow missing $required" }
          }
          if (@($types | Where-Object { "$_" -match 'Gate.?8' }).Count -gt 0) {
            throw 'Gate 8 node leaked into Gate 7 Preview package.'
          }

      - name: Write integrity sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path (Resolve-Path release).Path 'ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1.zip" | Set-Content -Encoding ascii release/ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1_SHA256.txt
          $build = Join-Path $env:RUNNER_TEMP 'conceptghost-g7-preview-r1'
          Copy-Item (Join-Path $build 'ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1/P10_GATE7_PREVIEW_R1_VALIDATION.txt') release/P10_GATE7_PREVIEW_R1_VALIDATION.txt -Force
          Write-Host "Gate 7 Preview r1 SHA-256: $hash"
          Write-Host "Gate 7 Preview r1 bytes: $((Get-Item $zip).Length)"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_GATE7_PREVIEW_R1_CANDIDATE
          path: |
            release/ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1.zip
            release/ConceptGhost_v1.54_P10_GATE7_PREVIEW_r1_SHA256.txt
            release/P10_GATE7_PREVIEW_R1_VALIDATION.txt
          if-no-files-found: error
          retention-days: 30

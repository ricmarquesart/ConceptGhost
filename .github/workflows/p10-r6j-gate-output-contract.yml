name: Build R6J Gate Output Contract

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/p10_lab/gate_output_contract.py'
      - 'Experimental/P10_Lab/p10_lab/gate6_geometry_output.py'
      - 'Experimental/P10_Lab/p10_lab/refined_evidence.py'
      - 'Experimental/P10_Lab/p10_lab/wan_sequence.py'
      - 'Experimental/P10_Lab/p10_lab/reconstruction_runtime.py'
      - 'Experimental/P10_Lab/p10_lab/reconstruction_node.py'
      - 'Experimental/P10_Lab/p10_lab/preview_nodes.py'
      - 'Experimental/P10_Lab/p10_lab/workflow_integration.py'
      - 'Experimental/P10_Lab/p10_lab/gate7_runtime.py'
      - 'Experimental/P10_Lab/p10_lab/gate7_visual_review.py'
      - 'Experimental/P10_Lab/p10_lab/run_audit_bundle.py'
      - 'Experimental/P10_Lab/tests/test_gate_output_contract.py'
      - 'Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract/**'
      - '.github/workflows/p10-r6j-gate-output-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy

      - name: Validate Gate Output Contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'Experimental/P10_Lab').Path
          python -m unittest Experimental/P10_Lab/tests/test_gate_output_contract.py Experimental/P10_Lab/tests/test_gate6_geometry_output.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile Experimental/P10_Lab/p10_lab/gate_output_contract.py Experimental/P10_Lab/p10_lab/gate6_geometry_output.py Experimental/P10_Lab/p10_lab/refined_evidence.py Experimental/P10_Lab/p10_lab/wan_sequence.py Experimental/P10_Lab/p10_lab/reconstruction_runtime.py Experimental/P10_Lab/p10_lab/gate7_runtime.py Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract/apply_hotfix.py Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract/patch_workflows.py Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract/verify_hotfix.py Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract/backfill_last_attempt.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build R6J package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'ConceptGhost_R6J_GATE_OUTPUT_CONTRACT_r1'
          $repoRoot = (Resolve-Path '.').Path
          $src = Resolve-Path 'Experimental/P10_Lab/release_hotfixes/r6j_gate_output_contract'
          $release = Join-Path $repoRoot 'release'
          $root = Join-Path $release $name
          $installer = Join-Path $root 'Installer'
          $payload = Join-Path $root 'Payload\custom_nodes\ConceptGhost_P10_Lab'
          New-Item -ItemType Directory -Force -Path $installer | Out-Null
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          foreach ($file in @('apply_hotfix.py','patch_workflows.py','verify_hotfix.py','backfill_last_attempt.py')) {
            Copy-Item (Join-Path $src $file) (Join-Path $installer $file) -Force
          }
          foreach ($file in @('01_APPLY_GATE_OUTPUT_CONTRACT.bat','02_VERIFY_GATE_OUTPUT_CONTRACT.bat','03_BACKFILL_LAST_RUN_GATE_OUTPUTS.bat','README_R6J.md')) {
            Copy-Item (Join-Path $src $file) (Join-Path $root $file) -Force
          }
          foreach ($file in @(
            'gate_output_contract.py',
            'gate6_geometry_output.py',
            'refined_evidence.py',
            'wan_sequence.py',
            'reconstruction_runtime.py',
            'reconstruction_node.py',
            'preview_nodes.py',
            'workflow_integration.py',
            'gate7_runtime.py',
            'gate7_visual_review.py',
            'run_audit_bundle.py'
          )) {
            Copy-Item (Join-Path 'Experimental/P10_Lab/p10_lab' $file) (Join-Path $payload $file) -Force
          }

          $manifest = [ordered]@{
            schema = 'ConceptGhost.R6JGateOutputContract.v0.1'
            release = $name
            source_commit = $env:GITHUB_SHA
            scope = 'PER_GATE_BLACK_BOX_OUTPUTS_AND_GATE6_FUNCTIONAL_3D_PROOF'
            gate_output_root = '<P9_RUN>/GATE_OUTPUTS/<P10_ATTEMPT_ID>'
            gate6_requires_nonempty_new_geometry = $true
            gate6_diagnostic_maya = $true
            gate7_diagnostic_maya = $true
            copies_all_gate4_control_pngs = $true
            copies_all_gate5_generated_pngs = $true
            backfill_existing_attempt_supported = $true
            p9_authority_changed = $false
            existing_wan_changed = $false
            moge_runtime_changed = $false
            shared_comfy_python_changed = $false
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $root 'HOTFIX_MANIFEST.json')
          "$env:GITHUB_SHA" | Set-Content -Encoding ascii (Join-Path $root 'SOURCE_COMMIT.txt')

          $lines = @()
          foreach ($file in Get-ChildItem $root -File -Recurse | Sort-Object FullName) {
            if ($file.Name -eq 'SHA256SUMS.txt') { continue }
            $relative = $file.FullName.Substring($root.Length + 1).Replace('\','/')
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $relative"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $root 'SHA256SUMS.txt')

          $zip = Join-Path $release ($name + '.zip')
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $name.zip" | Set-Content -Encoding ascii (Join-Path $release ($name + '_SHA256.txt'))
          Write-Host "R6J_BYTES=$((Get-Item $zip).Length)"
          Write-Host "R6J_SHA256=$zipHash"

      - name: Static package validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'release/ConceptGhost_R6J_GATE_OUTPUT_CONTRACT_r1'
          foreach ($p in @(
            '01_APPLY_GATE_OUTPUT_CONTRACT.bat',
            '02_VERIFY_GATE_OUTPUT_CONTRACT.bat',
            '03_BACKFILL_LAST_RUN_GATE_OUTPUTS.bat',
            'README_R6J.md',
            'HOTFIX_MANIFEST.json',
            'SOURCE_COMMIT.txt',
            'SHA256SUMS.txt',
            'Installer/apply_hotfix.py',
            'Installer/patch_workflows.py',
            'Installer/verify_hotfix.py',
            'Installer/backfill_last_attempt.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/gate_output_contract.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/gate6_geometry_output.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/refined_evidence.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/wan_sequence.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/reconstruction_runtime.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/gate7_runtime.py'
          )) {
            if (-not (Test-Path (Join-Path $root $p) -PathType Leaf)) { throw "missing $p" }
          }
          $manifest = Get-Content (Join-Path $root 'HOTFIX_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.gate6_requires_nonempty_new_geometry -ne $true) { throw 'Gate 6 functional contract missing' }
          if ($manifest.backfill_existing_attempt_supported -ne $true) { throw 'Backfill contract missing' }
          if ($manifest.p9_authority_changed -ne $false) { throw 'P9 authority mutation flag changed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_R6J_GATE_OUTPUT_CONTRACT_r1
          path: |
            release/ConceptGhost_R6J_GATE_OUTPUT_CONTRACT_r1.zip
            release/ConceptGhost_R6J_GATE_OUTPUT_CONTRACT_r1_SHA256.txt
          if-no-files-found: error
          retention-days: 30

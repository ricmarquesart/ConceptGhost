name: Build R6K Gate7 Maya Autopublish

on:
  push:
    branches:
      - work/v1.54-p10-multiview-completion
    paths:
      - 'Experimental/P10_Lab/p10_lab/gate_output_contract.py'
      - 'Experimental/P10_Lab/p10_lab/reconstruction_runtime.py'
      - 'Experimental/P10_Lab/p10_lab/gate7_runtime.py'
      - 'Experimental/P10_Lab/tests/test_gate_output_contract.py'
      - 'Experimental/P10_Lab/tests/test_gate7_runtime_visual_pack.py'
      - 'Experimental/P10_Lab/release_hotfixes/r6k_gate7_maya_autopublish/**'
      - '.github/workflows/p10-r6k-gate7-maya-autopublish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Validate R6K source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'Experimental/P10_Lab').Path
          python -m unittest Experimental/P10_Lab/tests/test_gate_output_contract.py Experimental/P10_Lab/tests/test_gate7_runtime_visual_pack.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile Experimental/P10_Lab/p10_lab/gate_output_contract.py Experimental/P10_Lab/p10_lab/reconstruction_runtime.py Experimental/P10_Lab/p10_lab/gate7_runtime.py Experimental/P10_Lab/release_hotfixes/r6k_gate7_maya_autopublish/apply_hotfix.py Experimental/P10_Lab/release_hotfixes/r6k_gate7_maya_autopublish/patch_workflows.py Experimental/P10_Lab/release_hotfixes/r6k_gate7_maya_autopublish/verify_hotfix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build R6K package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'ConceptGhost_R6K_GATE7_MAYA_AUTOPUBLISH_r1'
          $repoRoot = (Resolve-Path '.').Path
          $src = Resolve-Path 'Experimental/P10_Lab/release_hotfixes/r6k_gate7_maya_autopublish'
          $release = Join-Path $repoRoot 'release'
          $root = Join-Path $release $name
          $installer = Join-Path $root 'Installer'
          $payload = Join-Path $root 'Payload\custom_nodes\ConceptGhost_P10_Lab'
          New-Item -ItemType Directory -Force -Path $installer | Out-Null
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          foreach ($file in @('apply_hotfix.py','patch_workflows.py','verify_hotfix.py')) {
            Copy-Item (Join-Path $src $file) (Join-Path $installer $file) -Force
          }
          foreach ($file in @('01_APPLY_R6K_GATE7_OUTPUTS.bat','02_VERIFY_R6K_GATE7_OUTPUTS.bat','README_R6K.md')) {
            Copy-Item (Join-Path $src $file) (Join-Path $root $file) -Force
          }
          foreach ($file in @('gate_output_contract.py','reconstruction_runtime.py','gate7_runtime.py')) {
            Copy-Item (Join-Path 'Experimental/P10_Lab/p10_lab' $file) (Join-Path $payload $file) -Force
          }

          $manifest = [ordered]@{
            schema = 'ConceptGhost.R6KGate7MayaAutopublish.v0.1'
            release = $name
            source_commit = $env:GITHUB_SHA
            scope = 'AUTOMATIC_GATE1_7_OUTPUTS_PLUS_MAYA_CM_GATE7_COMPARISON'
            automatic_gate6_publication = $true
            automatic_gate7_publication_fresh = $true
            automatic_gate7_publication_resumed = $true
            workflow2_gate7_path_required = $true
            maya_cm_per_meter = 100.0
            gate7_separate_p9_and_p10_fill = $true
            gate7_combined_candidate_obj = $true
            manual_backfill_required_for_future_runs = $false
            canonical_geometry_changed = $false
            p9_authority_changed = $false
            moge_runtime_changed = $false
            shared_comfy_python_changed = $false
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $root 'HOTFIX_MANIFEST.json')
          "$env:GITHUB_SHA" | Set-Content -Encoding ascii (Join-Path $root 'SOURCE_COMMIT.txt')

          $lines = @()
          foreach ($file in Get-ChildItem $root -File -Recurse | Sort-Object FullName) {
            if ($file.Name -eq 'SHA256SUMS.txt') { continue }
            $relative = $file.FullName.Substring($root.Length + 1).Replace('\','/')
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $relative"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $root 'SHA256SUMS.txt')

          $zip = Join-Path $release ($name + '.zip')
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $name.zip" | Set-Content -Encoding ascii (Join-Path $release ($name + '_SHA256.txt'))
          Write-Host "R6K_BYTES=$((Get-Item $zip).Length)"
          Write-Host "R6K_SHA256=$zipHash"

      - name: Static package validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'release/ConceptGhost_R6K_GATE7_MAYA_AUTOPUBLISH_r1'
          foreach ($p in @(
            '01_APPLY_R6K_GATE7_OUTPUTS.bat',
            '02_VERIFY_R6K_GATE7_OUTPUTS.bat',
            'README_R6K.md',
            'HOTFIX_MANIFEST.json',
            'SOURCE_COMMIT.txt',
            'SHA256SUMS.txt',
            'Installer/apply_hotfix.py',
            'Installer/patch_workflows.py',
            'Installer/verify_hotfix.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/gate_output_contract.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/reconstruction_runtime.py',
            'Payload/custom_nodes/ConceptGhost_P10_Lab/gate7_runtime.py'
          )) {
            if (-not (Test-Path (Join-Path $root $p) -PathType Leaf)) { throw "missing $p" }
          }
          $manifest = Get-Content (Join-Path $root 'HOTFIX_MANIFEST.json') -Raw | ConvertFrom-Json
          if ($manifest.automatic_gate7_publication_fresh -ne $true) { throw 'fresh Gate 7 autopublish missing' }
          if ($manifest.automatic_gate7_publication_resumed -ne $true) { throw 'resumed Gate 7 autopublish missing' }
          if ($manifest.maya_cm_per_meter -ne 100.0) { throw 'Maya scale bridge missing' }
          if ($manifest.manual_backfill_required_for_future_runs -ne $false) { throw 'manual backfill should not be required' }
          if ($manifest.canonical_geometry_changed -ne $false) { throw 'canonical geometry mutation flag changed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_R6K_GATE7_MAYA_AUTOPUBLISH_r1
          path: |
            release/ConceptGhost_R6K_GATE7_MAYA_AUTOPUBLISH_r1.zip
            release/ConceptGhost_R6K_GATE7_MAYA_AUTOPUBLISH_r1_SHA256.txt
          if-no-files-found: error
          retention-days: 30

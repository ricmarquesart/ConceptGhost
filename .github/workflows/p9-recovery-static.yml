name: P9 Static Complete Gate
on:
  push:
    branches: [work/p9-static-complete-v0400]
  workflow_dispatch:
jobs:
  p9-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip numpy
      - run: python recovery/v0381/tests/test_recovery.py
      - run: python recovery/v0382/tests/test_contracts.py
      - run: python recovery/v0390/test_p9_10_regional.py
      - run: python recovery/v0400/test_p9_static_complete.py

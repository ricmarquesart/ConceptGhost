name: P9 v0.41.8 MoGe-3 Watchdog Race Gate
on:
  push:
    branches: [work/p9-moge3-watchdog-race-v0418]
  workflow_dispatch:
jobs:
  p9-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip numpy
      - run: python recovery/v0381/tests/test_recovery.py
      - run: python recovery/v0382/tests/test_contracts.py
      - run: python recovery/v0390/test_p9_10_regional.py
      - run: python recovery/v0400/test_p9_static_complete.py
      - run: python recovery/v0401/test_runtime_wiring.py
      - run: python recovery/v0410/test_fov_authority.py
      - run: python recovery/v0411/test_dense_depth_tensor_coalesce.py
      - run: python recovery/v0412/test_branch_export_layout.py
      - run: python recovery/v0413/test_maya_camera_signature.py
      - run: python recovery/v0414/test_primarymesh_optional_array.py
      - run: python recovery/v0415/test_maya_fov_zero_delta.py
      - run: python recovery/v0416/test_moge3_watchdog.py
      - run: python recovery/v0417/test_output_run_pack.py
      - run: python recovery/v0418/test_moge3_watchdog_race.py

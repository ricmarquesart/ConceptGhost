name: ConceptGhost v0.44 Consolidated Runtime Gate
on:
  push:
    branches: [work/v044-consolidated-runtime]
  workflow_dispatch:
jobs:
  v044-consolidated-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip numpy
      - run: python recovery/v0420/test_v042_policy.py
      - run: python recovery/v0430/test_v043_manual_metric_policy.py
      - run: python recovery/v0431/test_v0431_maya_metric_unit_policy.py
      - run: python recovery/v0432/test_v0432_lowres_projection_support_policy.py
      - run: python recovery/v0440/test_v044_consolidated_runtime_policy.py

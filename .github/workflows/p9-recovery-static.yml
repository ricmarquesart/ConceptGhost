name: ConceptGhost v0.43.1 Maya Metric Unit Hotfix Gate
on:
  push:
    branches: [work/p9-maya-metric-unit-v0431]
  workflow_dispatch:
jobs:
  v0431-maya-metric-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip numpy
      - run: python recovery/v0413/test_maya_camera_signature.py
      - run: python recovery/v0414/test_primarymesh_optional_array.py
      - run: python recovery/v0415/test_maya_fov_zero_delta.py
      - run: python recovery/v0419/test_run_parameters_baseline_identity.py
      - run: python recovery/v04110/test_legacy_workflow_compatibility.py
      - run: python recovery/v0420/test_v042_policy.py
      - run: python recovery/v0430/test_v043_manual_metric_policy.py
      - run: python recovery/v0431/test_v0431_maya_metric_unit_policy.py

name: ConceptGhost Tests

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'lab/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile all project scripts
        run: python -m compileall -q scripts

      - name: Compile P10 laboratory
        run: python -m compileall -q p10_lab tests
        working-directory: Experimental/P10_Lab

      - name: Validate upstream reference lock contract
        run: python -m unittest tests.test_reference_sources -v

      - name: Validate P10 complete-release integrity regressions
        run: python -m unittest tests.test_release_integrity -v
        working-directory: Experimental/P10_Lab

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run P10 laboratory tests
        run: python -m unittest discover -s tests -v
        working-directory: Experimental/P10_Lab

  release-package:
    name: Stage 4S v0.4.6 package
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run final tests and capture log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          python -m compileall -q scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath release/stage04s_v0.4.6_tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build package and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git archive --format=zip --output=release/ConceptGhost_Stage04S_v0.4.6.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash release/ConceptGhost_Stage04S_v0.4.6.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConceptGhost_Stage04S_v0.4.6.zip" | Set-Content -Encoding ascii release/ConceptGhost_Stage04S_v0.4.6_SHA256.txt

      - name: Extracted ZIP smoke test and CRLF validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path release).Path
          $zip = Join-Path $release 'ConceptGhost_Stage04S_v0.4.6.zip'
          $smoke = Join-Path $env:RUNNER_TEMP 'conceptghost-stage04s-v0.4.6-smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive -Path $zip -DestinationPath $smoke -Force

          $required = @(
            'STAGE4S_FINALIZE.bat',
            'STORAGE_MIGRATION.bat',
            'STORAGE.bat',
            'config.yml',
            'scripts/cg_paths.py',
            'scripts/cg_storage_migration.py',
            'scripts/cg_stage4s_finalize.py',
            'scripts/cg_storage.py',
            'scripts/cg_find_python.ps1',
            'tests/test_stage4s_finalize.py',
            'tests/test_stage4s_packaging.py'
          )
          foreach ($rel in $required) {
            $candidate = Join-Path $smoke $rel
            if (-not (Test-Path $candidate -PathType Leaf)) { throw "Required package file missing: $rel" }
          }

          $bats = Get-ChildItem -Path $smoke -Filter '*.bat' -File
          if (-not $bats) { throw 'No top-level BAT files found in extracted package.' }
          foreach ($bat in $bats) {
            $bytes = [System.IO.File]::ReadAllBytes($bat.FullName)
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i - 1] -ne 13)) {
                throw "CRLF validation failed for $($bat.Name): LF-only newline detected."
              }
            }
          }

          $smokeLog = Join-Path $release 'stage04s_v0.4.6_smoke.log'
          Push-Location $smoke
          try {
            python -m compileall -q scripts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath $smokeLog
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'ConceptGhost Stage 4S v0.4.6 validation',
            '========================================',
            "Commit: $env:GITHUB_SHA",
            "ZIP SHA-256: $hash",
            'Required package files: PASS',
            'Protected Python locator included: PASS',
            'Top-level BAT CRLF validation: PASS',
            'Full repository tests: PASS',
            'Extracted ZIP smoke tests: PASS',
            'Delete-capable Stage 4S action: NONE',
            'Operational rule: extract the ZIP on Google Drive and run BATs from the extracted package.',
            'Validation status: PASS'
          ) | Set-Content -Encoding utf8 (Join-Path $release 'ConceptGhost_Stage04S_v0.4.6_validation.txt')

      - name: Upload Stage 4S release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConceptGhost_Stage04S_v0.4.6_READY
          path: |
            release/ConceptGhost_Stage04S_v0.4.6.zip
            release/ConceptGhost_Stage04S_v0.4.6_SHA256.txt
            release/ConceptGhost_Stage04S_v0.4.6_validation.txt
            release/stage04s_v0.4.6_tests.log
            release/stage04s_v0.4.6_smoke.log
          if-no-files-found: error
          retention-days: 30

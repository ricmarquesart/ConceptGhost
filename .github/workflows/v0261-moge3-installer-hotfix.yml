name: ConceptGhost v0.26.1 MoGe-3 Installer Hotfix

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.26.1_MoGe3_Installer_Hotfix/**'
      - '.github/workflows/v0261-moge3-installer-hotfix.yml'
  workflow_dispatch:

jobs:
  powershell-51-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = 'releases/ConceptGhost_v0.26.1_MoGe3_Installer_Hotfix/Scripts/install_moge3_runtime.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'PowerShell parser errors found'
          }

      - name: Validate isolation and argument contract
        shell: powershell
        run: |
          $script = 'releases/ConceptGhost_v0.26.1_MoGe3_Installer_Hotfix/Scripts/install_moge3_runtime.ps1'
          $t = Get-Content $script -Raw
          if ($t -match '\[string\[\]\]\$Args') { throw 'Forbidden automatic-variable collision remains' }
          if ($t -notmatch '\[string\[\]\]\$CommandArgs') { throw 'CommandArgs contract missing' }
          if ($t -notmatch '@CommandArgs') { throw 'Native command splatting missing' }
          if ($t -notmatch 'PrependPath=0') { throw 'Private Python PATH isolation missing' }
          if ($t -match '(?im)^\s*setx\s') { throw 'Persistent environment mutation found' }
          if ($t -notmatch 'ConceptGhost-MoGeRuntime-v1') { throw 'Private runtime root missing' }

      - name: Exercise Run function with healthy stderr and nonzero exit
        shell: powershell
        run: |
          $script = 'releases/ConceptGhost_v0.26.1_MoGe3_Installer_Hotfix/Scripts/install_moge3_runtime.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          $runAst = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Run' }, $true)
          if (-not $runAst) { throw 'Run function not found' }
          Invoke-Expression $runAst.Extent.Text

          $Log = Join-Path $env:RUNNER_TEMP 'native-run-test.log'
          function Log([string]$Text) { Add-Content -Path $Log -Value $Text }

          Run -Exe $env:ComSpec -CommandArgs @('/d','/c','echo healthy-stderr 1>&2 & exit /b 0')

          $caught = $false
          try {
            Run -Exe $env:ComSpec -CommandArgs @('/d','/c','exit /b 7')
          }
          catch {
            if ($_.Exception.Message -match 'exit code 7') { $caught = $true } else { throw }
          }
          if (-not $caught) { throw 'Run did not surface nonzero exit code 7' }

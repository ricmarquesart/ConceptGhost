name: ConceptGhost v0.27 MoGe-3 Selector

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/**'
      - '.github/workflows/v027-moge3-selector.yml'
  workflow_dispatch:

jobs:
  reconstruct-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct v0.27 source from v0.26 snapshot + exact patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cg027
          mkdir -p /tmp/cg027
          unzip -q releases/ConceptGhost_v0.26_MoGe3_PhaseA_Clean/ConceptGhost_v0.26_MoGe3_PhaseA_Clean_SOURCE.zip -d /tmp/cg027
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/SOURCE_PATCH_FROM_V026.diff.gz.b64').read_text().strip()
          pathlib.Path('/tmp/v027.patch').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY
          cd /tmp/cg027/ConceptGhost_v0.26_MoGe3_PhaseA_Clean
          git init -q
          git apply /tmp/v027.patch
          python -m compileall -q custom_nodes/ConceptGhost_Stage68
          python -m pytest -q -k 'not moge3_pinned_source_is_complete_and_hash_locked'

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct source
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cg027'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Expand-Archive -Path 'releases/ConceptGhost_v0.26_MoGe3_PhaseA_Clean/ConceptGhost_v0.26_MoGe3_PhaseA_Clean_SOURCE.zip' -DestinationPath $out -Force
          @'
          import base64, gzip, pathlib
          src = pathlib.Path(r"releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/SOURCE_PATCH_FROM_V026.diff.gz.b64").read_text().strip()
          pathlib.Path(r"$env:RUNNER_TEMP\v027.patch")
          '@ | Out-Null
          python -c "import base64,gzip,pathlib,os; s=pathlib.Path(r'releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/SOURCE_PATCH_FROM_V026.diff.gz.b64').read_text().strip(); pathlib.Path(os.path.join(os.environ['RUNNER_TEMP'],'v027.patch')).write_bytes(gzip.decompress(base64.b64decode(s)))"
          Push-Location (Join-Path $out 'ConceptGhost_v0.26_MoGe3_PhaseA_Clean')
          git init -q
          git apply (Join-Path $env:RUNNER_TEMP 'v027.patch')
          Pop-Location

      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'cg027\ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          foreach ($rel in @('Scripts\install_moge3_runtime.ps1','Scripts\install_v027_clean.ps1','Scripts\verify_v027_installed.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pkg $rel), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser errors in $rel"
            }
          }

      - name: Exercise native stderr contract
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'cg027\ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          $script = Join-Path $pkg 'Scripts\install_moge3_runtime.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          $runAst = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Run' }, $true)
          if (-not $runAst) { throw 'Run function not found' }
          Invoke-Expression $runAst.Extent.Text
          $Logs = $env:RUNNER_TEMP
          $Log = Join-Path $env:RUNNER_TEMP 'run-function.log'
          function Log([string]$Text) { Add-Content -Path $Log -Value $Text }

          Run -Exe $env:ComSpec -CommandArgs @('/d','/c','echo harmless-warning 1>&2 & exit /b 0')

          $caught = $false
          try { Run -Exe $env:ComSpec -CommandArgs @('/d','/c','exit /b 7') }
          catch {
            if ($_.Exception.Message -match 'exit code 7') { $caught = $true } else { throw }
          }
          if (-not $caught) { throw 'Non-zero native exit code was not surfaced' }

      - name: Validate selector and isolation source contracts
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'cg027\ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          $nodes = Get-Content (Join-Path $pkg 'custom_nodes\ConceptGhost_Stage68\nodes.py') -Raw
          $workflow = Get-Content (Join-Path $pkg 'Workflows\Project\ConceptGhost_Master.json') -Raw
          foreach ($t in @('moge_version','ConceptGhostMoGe3Inference','ConceptGhostMoGeVersionRouter')) {
            if ($nodes -notmatch [regex]::Escape($t)) { throw "Missing selector token $t" }
          }
          if ($workflow -match 'semantic_assist_enabled|semantic_backend|semantic_refine_mode|semantic_profile') { throw 'Retired Semantic control remains' }
          $installer = Get-Content (Join-Path $pkg 'Scripts\install_moge3_runtime.ps1') -Raw
          if ($installer -notmatch 'PrependPath=0') { throw 'Private Python isolation missing' }
          if ($installer -match '(?im)^\s*setx\s') { throw 'Persistent PATH/environment mutation found' }

name: ConceptGhost v0.28 Maya Recovery + Normals

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.28_MayaRecovery_NormalsGate/**'
      - '.github/workflows/v028-maya-recovery-normals.yml'
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct v0.28 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/cg028"
          mkdir -p "$OUT"
          unzip -q "$ROOT/releases/ConceptGhost_v0.26_MoGe3_PhaseA_Clean/ConceptGhost_v0.26_MoGe3_PhaseA_Clean_SOURCE.zip" -d "$OUT"
          python - <<'PY'
          import base64, gzip, glob, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])

          p27 = "".join(pathlib.Path(p).read_text().strip() for p in sorted(glob.glob(str(root / "releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/SOURCE_PATCH_FROM_V026.part*"))))
          (temp / "v027.patch").write_bytes(gzip.decompress(base64.b64decode(p27)))

          p28 = "".join(pathlib.Path(p).read_text().strip() for p in sorted(glob.glob(str(root / "releases/ConceptGhost_v0.28_MayaRecovery_NormalsGate/SOURCE_PATCH_FROM_V027.part*.b64"))))
          (temp / "v028.patch").write_bytes(gzip.decompress(base64.b64decode(p28)))
          PY
          cd "$OUT/ConceptGhost_v0.26_MoGe3_PhaseA_Clean"
          git init -q
          git apply "$RUNNER_TEMP/v027.patch"
          git apply "$RUNNER_TEMP/v028.patch"
          python -m compileall -q custom_nodes/ConceptGhost_Stage68
          python -m pytest -q -k 'not moge3_pinned_source_is_complete_and_hash_locked'

      - name: Validate v0.28 source contracts
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/cg028/ConceptGhost_v0.26_MoGe3_PhaseA_Clean"
          test -f "$PKG/custom_nodes/ConceptGhost_Stage68/run_maya_worker.bat"
          grep -q "mayapy.exe" "$PKG/custom_nodes/ConceptGhost_Stage68/run_maya_worker.bat"
          grep -q "MAYA_REOPEN" "$PKG/custom_nodes/ConceptGhost_Stage68/conceptghost_maya_worker.py"
          grep -q "FBX_ROUNDTRIP" "$PKG/custom_nodes/ConceptGhost_Stage68/conceptghost_maya_worker.py"
          grep -q "_npz_orientation_gate" "$PKG/custom_nodes/ConceptGhost_Stage68/conceptghost_maya_worker.py"
          grep -q "_ensure_fbx_media_folder" "$PKG/custom_nodes/ConceptGhost_Stage68/conceptghost_maya_worker.py"
          grep -q "final_topology_camera_facing_face_vertex_normals_v0.28" "$PKG/custom_nodes/ConceptGhost_Stage68/nodes.py"
          grep -q "RECOVER_EXISTING_MAYA_OUTPUT" "$PKG/README.md"
          if grep -Eiq 'semantic_assist_enabled|semantic_backend|semantic_refine_mode|semantic_profile' "$PKG/Workflows/Project/ConceptGhost_Master.json"; then
            echo "Retired Semantic/SAM controls found"
            exit 1
          fi

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct v0.28 source
        shell: powershell
        run: |
          $root = $env:GITHUB_WORKSPACE
          $out = Join-Path $env:RUNNER_TEMP 'cg028'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Expand-Archive -Path (Join-Path $root 'releases\ConceptGhost_v0.26_MoGe3_PhaseA_Clean\ConceptGhost_v0.26_MoGe3_PhaseA_Clean_SOURCE.zip') -DestinationPath $out -Force

          @'
          import base64, gzip, glob, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          p27 = "".join(pathlib.Path(p).read_text().strip() for p in sorted(glob.glob(str(root / "releases/ConceptGhost_v0.27_MoGe3_Selector_Clean/SOURCE_PATCH_FROM_V026.part*"))))
          (temp / "v027.patch").write_bytes(gzip.decompress(base64.b64decode(p27)))
          p28 = "".join(pathlib.Path(p).read_text().strip() for p in sorted(glob.glob(str(root / "releases/ConceptGhost_v0.28_MayaRecovery_NormalsGate/SOURCE_PATCH_FROM_V027.part*.b64"))))
          (temp / "v028.patch").write_bytes(gzip.decompress(base64.b64decode(p28)))
          '@ | python -

          $pkg = Join-Path $out 'ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          Push-Location $pkg
          git init -q
          git apply (Join-Path $env:RUNNER_TEMP 'v027.patch')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply (Join-Path $env:RUNNER_TEMP 'v028.patch')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q custom_nodes\ConceptGhost_Stage68
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -k 'not moge3_pinned_source_is_complete_and_hash_locked'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'cg028\ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          $scripts = @(
            'Scripts\install_v028_clean.ps1',
            'Scripts\verify_v028_installed.ps1',
            'Scripts\recover_existing_maya_output.ps1',
            'Scripts\verify_latest_maya_output.ps1'
          )
          foreach ($rel in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pkg $rel), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser errors in $rel"
            }
          }

      - name: Validate Maya recovery and normals contracts
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'cg028\ConceptGhost_v0.26_MoGe3_PhaseA_Clean'
          $launcher = Join-Path $pkg 'custom_nodes\ConceptGhost_Stage68\run_maya_worker.bat'
          if (-not (Test-Path $launcher)) { throw 'run_maya_worker.bat missing' }
          $launcherText = Get-Content $launcher -Raw
          if ($launcherText -notmatch 'mayapy\.exe') { throw 'mayapy discovery missing' }
          if ($launcherText -notmatch 'conceptghost_maya_worker\.py') { throw 'Maya worker invocation missing' }

          $worker = Get-Content (Join-Path $pkg 'custom_nodes\ConceptGhost_Stage68\conceptghost_maya_worker.py') -Raw
          foreach ($token in @('MAYA_REOPEN','FBX_ROUNDTRIP','_npz_orientation_gate','_ensure_fbx_media_folder','mesh_orientation_checks')) {
            if ($worker -notmatch [regex]::Escape($token)) { throw "Missing worker token: $token" }
          }

          $nodes = Get-Content (Join-Path $pkg 'custom_nodes\ConceptGhost_Stage68\nodes.py') -Raw
          if ($nodes -notmatch 'final_topology_camera_facing_face_vertex_normals_v0\.28') { throw 'v0.28 normals policy missing' }

          foreach ($file in @('RECOVER_EXISTING_MAYA_OUTPUT.bat','VERIFY_LATEST_MAYA_OUTPUT.bat','INSTALL_V028_CLEAN.bat','VERIFY_V028_INSTALLED.bat')) {
            if (-not (Test-Path (Join-Path $pkg $file))) { throw "Missing utility: $file" }
          }

          $workflow = Get-Content (Join-Path $pkg 'Workflows\Project\ConceptGhost_Master.json') -Raw
          if ($workflow -match 'semantic_assist_enabled|semantic_backend|semantic_refine_mode|semantic_profile') { throw 'Retired Semantic/SAM control remains' }

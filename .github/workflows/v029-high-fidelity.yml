name: ConceptGhost v0.29 High Fidelity

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.29_MoGe3_HighFidelity/**'
      - '.github/workflows/v029-high-fidelity.yml'
  workflow_dispatch:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode source snapshot
        shell: bash
        run: |
          set -euo pipefail
          B64="releases/ConceptGhost_v0.29_MoGe3_HighFidelity/ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE.zip.b64"
          base64 -d "$B64" > "$RUNNER_TEMP/v029.zip"
          unzip -q "$RUNNER_TEMP/v029.zip" -d "$RUNNER_TEMP/v029"

      - name: Compile and validate workflow/profile contracts
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/v029/ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE"
          python -m compileall -q "$PKG/custom_nodes/ConceptGhost_Stage68" "$PKG/Tools/MoGeRuntime/worker"
          PKG="$PKG" python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["PKG"])
          wf=json.loads((root/"Workflows/Project/ConceptGhost_Master.json").read_text(encoding="utf-8"))
          nodes={n["id"]:n for n in wf["nodes"]}
          links=wf["links"]
          assert len(nodes)==34, len(nodes)
          assert len(links)==90, len(links)
          ids={l[0] for l in links}
          for l in links:
              assert l[1] in nodes and l[3] in nodes, l
          for n in nodes.values():
              for o in n.get("outputs",[]) or []:
                  for lid in o.get("links") or []:
                      assert lid in ids, (n["id"],lid)
              for i in n.get("inputs",[]) or []:
                  lid=i.get("link")
                  if lid is not None:
                      assert lid in ids, (n["id"],lid)
          master=next(n for n in nodes.values() if n.get("type")=="ConceptGhostMasterConfig")
          assert master["widgets_values"][3:6] == ["MoGe","MoGe-3","Standard"], master["widgets_values"]
          assert sum(n.get("type")=="ConceptGhostGeometryProfile" for n in nodes.values())==1
          text=(root/"custom_nodes/ConceptGhost_Stage68/nodes.py").read_text(encoding="utf-8")
          for token in ["Ruicheng/moge-3-vitg","High Fidelity","refine_steps","full_resolution_depth_edge_preserving"]:
              assert token in text, token
          wft=(root/"Workflows/Project/ConceptGhost_Master.json").read_text(encoding="utf-8").lower()
          for token in ["semantic_assist_enabled","semantic_backend","semantic_refine_mode","semantic_profile","conceptghostsemanticassist","cg_semantic_bundle"]:
              assert token not in wft, token
          worker=(root/"Tools/MoGeRuntime/worker/moge_worker.py").read_text(encoding="utf-8")
          assert "does not silently fall back" in worker
          installer=(root/"Scripts/install_moge3_runtime.ps1").read_text(encoding="utf-8")
          for token in ["PrependPath=0","Ruicheng/moge-3-vitg","precache_moge3_models.py"]:
              assert token in installer, token
          assert "setx " not in installer.lower()
          print("v0.29 source contract PASS")
          PY

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode source snapshot
        shell: powershell
        run: |
          $b64 = 'releases\ConceptGhost_v0.29_MoGe3_HighFidelity\ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE.zip.b64'
          $bytes = [Convert]::FromBase64String((Get-Content $b64 -Raw).Trim())
          $zip = Join-Path $env:RUNNER_TEMP 'v029.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $out = Join-Path $env:RUNNER_TEMP 'v029'
          Expand-Archive -Path $zip -DestinationPath $out -Force

      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'v029\ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE'
          $scripts = @(
            'Scripts\install_conceptghost.ps1',
            'Scripts\install_comfy_payload.ps1',
            'Scripts\install_moge3_runtime.ps1',
            'Scripts\remove_semantic_assist_runtime.ps1',
            'Scripts\verify_conceptghost.ps1',
            'Scripts\verify_high_fidelity_vitg.ps1'
          )
          foreach ($rel in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pkg $rel), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser errors in $rel"
            }
          }

      - name: Validate isolated installer contract
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'v029\ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE'
          $installer = Get-Content (Join-Path $pkg 'Scripts\install_moge3_runtime.ps1') -Raw
          foreach ($token in @('ConceptGhost-MoGeRuntime-v1','PrependPath=0','Include_launcher=0','AssociateFiles=0','Ruicheng/moge-3-vitg','precache_moge3_models.py')) {
            if ($installer -notmatch [regex]::Escape($token)) { throw "Missing isolation/install token: $token" }
          }
          if ($installer -match '(?im)^\s*setx\s') { throw 'Persistent global environment mutation found' }
          $workflow = Get-Content (Join-Path $pkg 'Workflows\Project\ConceptGhost_Master.json') -Raw
          if ($workflow -match 'semantic_assist_enabled|semantic_backend|semantic_refine_mode|semantic_profile') { throw 'Retired Semantic control remains' }

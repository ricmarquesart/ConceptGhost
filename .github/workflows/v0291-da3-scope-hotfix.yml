name: ConceptGhost v0.29.1 DA3 Scope Hotfix

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.29.1_MoGe3_HighFidelity_Hotfix/**'
      - '.github/workflows/v0291-da3-scope-hotfix.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct v0.29 and apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          B64="releases/ConceptGhost_v0.29_MoGe3_HighFidelity/ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE.zip.b64"
          base64 -d "$B64" > "$RUNNER_TEMP/v029.zip"
          unzip -q "$RUNNER_TEMP/v029.zip" -d "$RUNNER_TEMP/v029"
          PKG="$RUNNER_TEMP/v029/ConceptGhost_v0.29_MoGe3_HighFidelity_SOURCE"
          cd "$PKG"
          git init -q
          git apply "$GITHUB_WORKSPACE/releases/ConceptGhost_v0.29.1_MoGe3_HighFidelity_Hotfix/nodes_hotfix.diff"
          python -m compileall -q custom_nodes/ConceptGhost_Stage68
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('custom_nodes/ConceptGhost_Stage68/nodes.py')
          mod=ast.parse(p.read_text(encoding='utf-8'))
          cls=next(n for n in mod.body if isinstance(n,ast.ClassDef) and n.name=='ConceptGhostDA3Evidence')
          fn=next(n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name=='build')
          loaded={n.id for n in ast.walk(fn) if isinstance(n,ast.Name) and isinstance(n.ctx,ast.Load)}
          assert 'geometry_profile' not in loaded
          assert 'resolved_profile' not in loaded
          text=p.read_text(encoding='utf-8')
          assert 'Ruicheng/moge-3-vitg' in text
          assert 'High Fidelity' in text
          print('v0.29.1 DA3 scope regression PASS')
          PY

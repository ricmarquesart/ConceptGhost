name: ConceptGhost v0.30 Canonical

on:
  push:
    paths:
      - 'releases/ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity/**'
      - '.github/workflows/v030-canonical.yml'
  workflow_dispatch:

jobs:
  linux-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct v0.30 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="releases/ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity"
          cat "$RELEASE"/SOURCE_ZIP.part*.b64 | base64 -d > "$RUNNER_TEMP/v030.zip"
          unzip -q "$RUNNER_TEMP/v030.zip" -d "$RUNNER_TEMP/v030"
          test -d "$RUNNER_TEMP/v030/ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy pillow

      - name: Compile and run v0.30 regressions
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/v030/ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity"
          python -m compileall -q "$PKG/custom_nodes/ConceptGhost_Stage68" "$PKG/Tools/MoGeRuntime/worker" "$PKG/Tests"
          python -m pytest -q "$PKG/Tests/test_v030_canonical.py"

      - name: Validate canonical workflow contract
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/v030/ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity"
          PKG="$PKG" python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["PKG"])
          wf = json.loads((root/"Workflows/Project/ConceptGhost_Master.json").read_text(encoding="utf-8"))
          nodes = {n["id"]: n for n in wf["nodes"]}
          links = wf["links"]
          assert len(nodes) == 26, len(nodes)
          assert len(links) == 66, len(links)
          link_ids = {l[0] for l in links}
          for l in links:
              assert l[1] in nodes and l[3] in nodes, l
          for n in nodes.values():
              for inp in n.get("inputs", []) or []:
                  lid = inp.get("link")
                  if lid is not None:
                      assert lid in link_ids
              for out in n.get("outputs", []) or []:
                  for lid in out.get("links") or []:
                      assert lid in link_ids

          text = (root/"custom_nodes/ConceptGhost_Stage68/nodes.py").read_text(encoding="utf-8")
          contracts = (root/"custom_nodes/ConceptGhost_Stage68/conceptghost_contracts.py").read_text(encoding="utf-8")
          worker = (root/"custom_nodes/ConceptGhost_Stage68/conceptghost_maya_worker.py").read_text(encoding="utf-8")
          workflow_text = (root/"Workflows/Project/ConceptGhost_Master.json").read_text(encoding="utf-8")
          active = "\n".join([text, contracts, worker, workflow_text]).lower()

          for retired in [
              "conceptghostda3evidence",
              "conceptghostatlastoda3cameraparams",
              "da3_tomesh",
              "da3_previewpointcloud",
              "comfyui-depthanythingv3",
              "depthanythingv3",
              "compare_both",
              "conceptghostgeometryrouter",
              "semantic_assist_enabled",
              "conceptghostsemanticassist",
              "cg_semantic_bundle",
          ]:
              assert retired not in active, retired

          for required in [
              "ConceptGhost.GeometryProfile.v1",
              "Ruicheng/moge-3-vitg",
              "moge_full_resolution_depth_edge_preserving",
              "depth_edge_rtol",
              "silent_fallback",
              "selected_profile",
              "effective_profile",
          ]:
              assert required.lower() in active, required

          manifest = json.loads((root/"RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "ConceptGhost.ReleaseManifest.v0.30"
          assert manifest["retired"]["da3_active_dependency"] is False
          assert manifest["installer"]["installs_da3"] is False
          hf = manifest["geometry"]["high_fidelity"]
          assert hf["model"] == "Ruicheng/moge-3-vitg"
          assert hf["transport_stride"] == 1
          assert hf["depth_edge_rtol"] == 0.04
          assert hf["silent_fallback"] is False
          print("v0.30 canonical source contract PASS")
          PY

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct v0.30 source snapshot
        shell: powershell
        run: |
          $release = 'releases\ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity'
          $parts = Get-ChildItem (Join-Path $release 'SOURCE_ZIP.part*.b64') | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64.Trim())
          $zip = Join-Path $env:RUNNER_TEMP 'v030.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $out = Join-Path $env:RUNNER_TEMP 'v030'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          if (-not (Test-Path (Join-Path $out 'ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity'))) { throw 'v0.30 source root missing' }

      - name: Parse every PowerShell script with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'v030\ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity'
          $scripts = Get-ChildItem (Join-Path $pkg 'Scripts') -Filter '*.ps1' -File
          if ($scripts.Count -eq 0) { throw 'No PowerShell scripts found' }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell parser errors in $($script.Name)"
            }
          }
          Write-Host "[PASS] Windows PowerShell parser accepted $($scripts.Count) scripts."

      - name: Validate installer isolation and DA3 retirement
        shell: powershell
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'v030\ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity'
          $runtime = Get-Content (Join-Path $pkg 'Scripts\install_moge3_runtime.ps1') -Raw
          foreach ($token in @('ConceptGhost-MoGeRuntime-v1','PrependPath=0','Include_launcher=0','AssociateFiles=0','Ruicheng/moge-3-vitg','precache_moge3_models.py')) {
            if ($runtime -notmatch [regex]::Escape($token)) { throw "Missing isolation/runtime token: $token" }
          }
          if ($runtime -match '(?im)^\s*setx\s') { throw 'Persistent global environment mutation found' }

          $install = (Get-Content (Join-Path $pkg 'Scripts\install_conceptghost.ps1') -Raw) + (Get-Content (Join-Path $pkg 'Scripts\install_comfy_payload.ps1') -Raw)
          foreach ($retired in @('ComfyUI-DepthAnythingV3','install_da3')) {
            if ($install -match [regex]::Escape($retired)) { throw "Retired DA3 installer dependency found: $retired" }
          }
          if (Test-Path (Join-Path $pkg 'APPLY_V0291_HOTFIX.bat')) { throw 'Legacy v0.29.1 hotfix remains in canonical bundle' }

      - name: Run v0.30 Python regressions on Windows
        shell: powershell
        run: |
          python -m pip install --upgrade pip pytest numpy pillow
          $pkg = Join-Path $env:RUNNER_TEMP 'v030\ConceptGhost_v0.30_Canonical_MoGe3_HighFidelity'
          python -m compileall -q (Join-Path $pkg 'custom_nodes\ConceptGhost_Stage68') (Join-Path $pkg 'Tools\MoGeRuntime\worker') (Join-Path $pkg 'Tests')
          python -m pytest -q (Join-Path $pkg 'Tests\test_v030_canonical.py')

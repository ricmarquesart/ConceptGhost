schema_version: 1

paths:
  project_root: "G:\\My Drive\\ConceptGhost"
  runtime_root: "C:\\ConceptGhostRuntime"
  workflows: "G:\\My Drive\\ConceptGhost\\Workflows"
  references: "G:\\My Drive\\ConceptGhost\\References"
  reports: "G:\\My Drive\\ConceptGhost\\Reports"
  logs: "G:\\My Drive\\ConceptGhost\\Logs"
  manifests: "G:\\My Drive\\ConceptGhost\\Manifests"
  outputs: "G:\\My Drive\\ConceptGhost\\Outputs"
  packages: "G:\\My Drive\\ConceptGhost\\Tests\\Packages"
  storage: "G:\\My Drive\\ConceptGhost\\Storage"
  cache: "C:\\ConceptGhostRuntime\\cache"
  workers: "C:\\ConceptGhostRuntime\\workers"
  temp: "C:\\ConceptGhostRuntime\\temp"
  local_state: "C:\\ConceptGhostRuntime\\local_state"

comfyui:
  root: auto
  require_exact_before_external_install: true

camera:
  engine: atlas_learned

geometry:
  engine: da3
  compare_both: false

outputs:
  camera: true
  diagnostics: true
  pointcloud: true
  maya: true
  atlas_relief_mesh: false
  moge_mesh: false
  da3_mesh: false

presets:
  active: balanced
  fast_test:
    description: low-cost validation preset
  balanced:
    description: default quality/performance preset, finalized after A/B testing
  max_reference:
    description: prioritize dense reference geometry over speed/storage

storage:
  track_every_write: true
  prevent_duplicate_models: true
  verify_hashes: true
  preserve_preexisting: true
  preserve_modified_on_uninstall: true
  cache_root: C:\\ConceptGhostRuntime\\cache\\downloads

safety:
  allow_external_downloads: false
  allow_external_writes: false
  stage_limit: 4
  note: Stage 4S dual-root path contract. Durable project IO targets Google Drive; runtime/cache remains local. Existing shared packages/projects must not be replaced, upgraded, reset, or overwritten.
